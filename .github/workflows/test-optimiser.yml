name: Test weekly grocery optimiser
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested solver
        run: python -m pip install -r requirements.txt
      - name: Validate complete catalogue
        run: python scripts/validate_seed_data.py
      - name: Regression and all-recipe tests
        run: python -m unittest discover -s tests -v
      - name: Run 7-day optimisation
        run: python scripts/optimise_week.py --days 7
